name: Go

on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Build
        run: go build -v ./..

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "catApi"
          path: "catApi"
